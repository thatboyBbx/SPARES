[alembic]
script_location = alembic
prepend_sys_path = .

# NOTE: this is a placeholder — the real URL is injected at runtime by
# alembic/env.py from app.core.config.Settings (which reads DATABASE_URL
# from the environment). Do not rely on this value.
sqlalchemy.url = postgresql+psycopg://spop:spop@localhost:5432/spop

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
